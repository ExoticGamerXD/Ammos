<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ede1"/>
      <stop offset="1" stop-color="#e9dcc3"/>
    </linearGradient>
    <linearGradient id="baklava1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0a54a"/>
      <stop offset="1" stop-color="#b9762a"/>
    </linearGradient>
    <linearGradient id="baklava2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eab765"/>
      <stop offset="1" stop-color="#c98736"/>
    </linearGradient>
    <linearGradient id="honey" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5b544" stop-opacity=".9"/>
      <stop offset="1" stop-color="#e09b2d" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#bg)"/>

  <!-- plate shadow -->
  <ellipse cx="150" cy="300" rx="120" ry="26" fill="#0a2540" opacity=".08"/>

  <!-- baklava pieces (rotated diamonds), layered lines suggest phyllo -->
  <g transform="translate(150,255) rotate(-8)">
    <rect x="-95" y="-46" width="190" height="92" rx="6" fill="url(#baklava1)"/>
    <g stroke="#8a5a20" stroke-width="1.4" opacity=".55">
      <line x1="-95" y1="-30" x2="95" y2="-30"/>
      <line x1="-95" y1="-12" x2="95" y2="-12"/>
      <line x1="-95" y1="6" x2="95" y2="6"/>
      <line x1="-95" y1="24" x2="95" y2="24"/>
    </g>
    <g stroke="#8a5a20" stroke-width="1.4" opacity=".4">
      <line x1="-63" y1="-46" x2="-63" y2="46"/>
      <line x1="-21" y1="-46" x2="-21" y2="46"/>
      <line x1="21" y1="-46" x2="21" y2="46"/>
      <line x1="63" y1="-46" x2="63" y2="46"/>
    </g>
  </g>

  <g transform="translate(150,190) rotate(6)">
    <rect x="-80" y="-38" width="160" height="76" rx="6" fill="url(#baklava2)"/>
    <g stroke="#9a6a2a" stroke-width="1.2" opacity=".5">
      <line x1="-80" y1="-24" x2="80" y2="-24"/>
      <line x1="-80" y1="-8" x2="80" y2="-8"/>
      <line x1="-80" y1="8" x2="80" y2="8"/>
      <line x1="-80" y1="24" x2="80" y2="24"/>
    </g>
    <g stroke="#9a6a2a" stroke-width="1.2" opacity=".35">
      <line x1="-53" y1="-38" x2="-53" y2="38"/>
      <line x1="-18" y1="-38" x2="-18" y2="38"/>
      <line x1="18" y1="-38" x2="18" y2="38"/>
      <line x1="53" y1="-38" x2="53" y2="38"/>
    </g>
  </g>

  <!-- honey drizzle -->
  <path d="M55 150 C 90 175, 110 195, 95 220 S 150 250, 140 275 S 200 245, 225 260" fill="none" stroke="url(#honey)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="225" cy="260" r="3.2" fill="#e09b2d" opacity=".85"/>
  <circle cx="70" cy="158" r="2.6" fill="#e09b2d" opacity=".85"/>

  <!-- chopped pistachio flecks -->
  <g fill="#7a9a4a">
    <circle cx="120" cy="205" r="2.4"/>
    <circle cx="176" cy="196" r="2"/>
    <circle cx="150" cy="222" r="2.2"/>
    <circle cx="132" cy="265" r="2.4"/>
    <circle cx="188" cy="272" r="2"/>
    <circle cx="164" cy="250" r="2.1"/>
    <circle cx="104" cy="252" r="2"/>
  </g>

  <!-- greek key strip footer -->
  <g transform="translate(0,378)" fill="none" stroke="#0a2540" stroke-width="3" opacity=".18">
    <path d="M0 12 H20 V0 H36 V12 H56 V0 H76 V12 H96 V0 H116 V12 H136 V0 H156 V12 H176 V0 H196 V12 H216 V0 H236 V12 H256 V0 H276 V12 H300"/>
  </g>
</svg>
